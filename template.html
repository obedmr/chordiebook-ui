<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChordieBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-table/1.10.1/bootstrap-table.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-table/1.10.1/bootstrap-table.min.js"></script>
  </head>
  <body>
    <main role="main" class="container-fluid app-main">
      <section class="top-bar" aria-labelledby="page-title">
        <div class="top-bar-copy">
          <p class="eyebrow" data-i18n="eyebrow">Song library</p>
          <h1 id="page-title">ChordieBook</h1>
          <p data-i18n="heroDescription">Search, select, and download worship songs in the format your team needs.</p>
        </div>
        <div class="top-bar-meta">
          <div class="format-summary" aria-label="Available formats">
            <span data-i18n="formatChords">PDF chords</span>
            <span data-i18n="formatLyrics">PDF lyrics</span>
            <span>OpenLP</span>
            <span>ChordPro</span>
          </div>
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" class="language-option" data-language="en">EN</button>
            <button type="button" class="language-option" data-language="es">ES</button>
          </div>
          <div class="selection-meter" aria-live="polite">
            <span id="selectionCount">0</span>
            <small data-i18n="selected">selected</small>
          </div>
        </div>
      </section>
      <section class="library-panel">
        <div class="toolbar">
          <div class="search-area">
            <label for="myInput" data-i18n="searchLabel">Search songs</label>
            <input type="search" id="myInput" class="form-control" placeholder="Search by song name..." data-i18n-placeholder="searchPlaceholder">
            <div id="catalogStatus" class="catalog-status" data-i18n="loadingCatalog">Loading catalog...</div>
          </div>
          <div class="download-area">
            <div class="btn-group download-options" id="downloadType" role="group" aria-label="Download format">
	    <input type="radio" class="btn-check" name="btnradio"
		   id="btnradio1" autocomplete="off" value="chords" checked>
	    <label class="btn btn-outline-primary" for="btnradio1" data-i18n="chords">Chords</label>

	    <input type="radio" class="btn-check" name="btnradio"
		   id="btnradio2" autocomplete="off" value="lyrics">
	    <label class="btn btn-outline-primary" for="btnradio2" data-i18n="lyrics">Lyrics</label>

	    <input type="radio" class="btn-check" name="btnradio"
		   id="btnradio3" autocomplete="off" value="openlp">
	    <label class="btn btn-outline-primary" for="btnradio3">OpenLP</label>

	    <input type="radio" class="btn-check" name="btnradio"
		   id="btnradio4" autocomplete="off" value="chordpro">
	    <label class="btn btn-outline-primary" for="btnradio4">ChordPro</label>
            </div>
	    <button type="button" class="btn btn-primary download-button" onClick="download()" data-i18n="downloadSelected">Download selected</button>
          </div>
        </div>
        <div class="table-shell">
        <table id="myTable"
	       class="table table-striped table-hover table-sm song-table"
	       data-classes="table table-hover table-condensed song-table"
	       data-striped="true"
	       data-sort-name="Quality"
	       data-sort-order="desc"
	       data-pagination="false"
	       >
          <thead class="table-dark">
            <tr>
	    <th data-field="state" data-checkbox="true"></th>
            <th scope="col" data-field="name" data-sortable="true" data-i18n="name">Name</th>
	    <th scope="col" data-field="key" data-sortable="true" data-i18n="key">Key</th>
	    <th scope="col" data-field="themes" data-sortable="true" data-i18n="themes">Themes</th>
	    <th scope="col" data-field="authors" data-sortable="true" data-i18n="authors">Authors</th>
            <th scope="col" data-field="chords" data-i18n="chords">Chords</th>
            <th scope="col" data-field="lyrics" data-i18n="lyrics">Lyrics</th>
            <th scope="col" data-field="openlp">OpenLP</th>
	    <th scope="col" data-field="chordpro">ChordPro</th>
            </tr>
          </thead>
	          <tbody></tbody>
        </table>
        </div>
      </section>
      <div id="result"></div>
	<script src="js/script.js"></script>
    </main>
  </body>
</html>
